<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>l10n — live speech translator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header>
      <h1>l10n <span class="tagline">live speech translator</span></h1>
      <button id="settingsBtn" class="ghost" title="Settings">⚙</button>
    </header>

    <div id="unsupportedBanner" class="banner hidden">
      This browser does not support the Web Speech API. Please use Chrome or Edge
      (desktop or Android) for the software prototype.
    </div>

    <section class="lang-row">
      <label class="lang-select">
        <span>I speak</span>
        <select id="srcLang"></select>
      </label>
      <button id="swapBtn" class="ghost" title="Swap languages">⇄</button>
      <label class="lang-select">
        <span>Translate to</span>
        <select id="tgtLang"></select>
      </label>
    </section>

    <section class="panes">
      <div class="pane">
        <div class="pane-title">You said</div>
        <div id="srcFinal" class="transcript"></div>
        <div id="srcInterim" class="transcript interim"></div>
      </div>
      <div class="pane">
        <div class="pane-title">Translation</div>
        <div id="tgtFinal" class="transcript"></div>
        <div id="tgtInterim" class="transcript interim"></div>
      </div>
    </section>

    <section class="controls">
      <button id="micBtn" class="mic">🎙 Start listening</button>
      <label class="check"><input type="checkbox" id="speakToggle" checked /> Speak translation</label>
      <label class="check"><input type="checkbox" id="duckToggle" checked /> Pause mic while speaking</label>
      <button id="clearBtn" class="ghost">Clear</button>
    </section>

    <footer>
      <span id="status">Idle</span>
      <span id="latency"></span>
    </footer>

    <dialog id="settingsDialog">
      <h2>Settings</h2>
      <label class="field">
        <span>Translation provider</span>
        <select id="providerSelect">
          <option value="free">Free (no API key, lower quality)</option>
          <option value="gemini">Gemini API (key required)</option>
          <option value="claude">Claude API (key required)</option>
        </select>
      </label>
      <label class="field">
        <span>API key</span>
        <input type="password" id="apiKeyInput" placeholder="Only needed for Gemini / Claude" autocomplete="off" />
      </label>
      <label class="field">
        <span>Voice for translated speech</span>
        <select id="voiceSelect">
          <option value="">Auto (match target language)</option>
        </select>
      </label>
      <div class="dialog-actions">
        <button id="settingsSave">Save</button>
        <button id="settingsClose" class="ghost">Close</button>
      </div>
      <p class="hint">
        Keys are stored only in this browser (localStorage) and sent directly to the
        provider — there is no backend.
      </p>
    </dialog>
  </main>
  <script src="app.js"></script>
</body>
</html>
